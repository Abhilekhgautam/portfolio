<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhilekh Gautam | Thoughts</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Importing 'Manrope' for a beautiful, modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/timeago.js/4.0.2/timeago.min.js"></script>

    <style>
        :root {
            --bg: #050505; /* Deep black-grey */
            --card-bg: #0f0f0f;
            --border: #333333; /* More visible border */
            --highlight-border: #555555;
            
            --text-main: #f0f0f0;
            --text-muted: #999999;
            --accent: #3b82f6; /* A clean electric blue */
            
            /* The New Beautiful Font */
            --font-sans: 'Manrope', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            overflow-y: scroll;
            /* Subtle grain or noise could go here, but keeping it clean */
        }

        .feed-container {
            max-width: 580px; 
            margin: 0 auto;
            padding-bottom: 60px;
        }

        /* Nav */
        nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .nav-title { 
            font-weight: 800; 
            font-size: 1.2rem; 
            letter-spacing: -0.02em;
        }
        
        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.4rem;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .back-btn:hover { 
            background-color: #1a1a1a; 
            border-color: var(--border);
        }

        /* --- POST CARD DESIGN --- */
        .post-card {
            background-color: var(--card-bg);
            /* Crisp, defined border */
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin: 0 16px 24px 16px;
            
            /* Subtle shadow to lift the card */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .post-card:hover {
            border-color: var(--highlight-border);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        /* Header */
        .post-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px; /* Squircle avatar matches the card */
            background: #222;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .row-top {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .display-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
        }

        .row-bottom {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Mood Badges */
        .mood-badge {
            font-size: 0.7rem;
            font-family: var(--font-mono);
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--accent);
            background: rgba(59, 130, 246, 0.05); /* Very subtle tint */
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Content */
        .post-content {
            font-size: 1rem;
            color: #e0e0e0;
            line-height: 1.6;
            word-wrap: break-word;
        }

        /* Markdown Styles */
        .post-content p { margin-bottom: 12px; }
        .post-content p:last-child { margin-bottom: 0; }
        
        .post-content a { 
            color: var(--accent); 
            text-decoration: none; 
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
        }
        .post-content a:hover { border-bottom-color: var(--accent); }
        
        .post-content img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 12px;
            border: 1px solid var(--border);
        }

        /* Code Blocks */
        .post-content pre {
            background: #000;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
            border: 1px solid var(--border);
            font-size: 0.9em;
        }
        .post-content code {
            font-family: var(--font-mono);
            background: rgba(255,255,255,0.05);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .loading { padding: 50px; text-align: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.9rem; }
        
        .footer-note {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            opacity: 0.5;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="feed-container">
        <nav>
            <a href="index.html" class="back-btn" title="Home">&larr;</a>
            <span class="nav-title">Core Dump</span>
            <div style="width: 36px;"></div> 
        </nav>

        <div id="feed">
            <div class="loading">Loading thoughts...</div>
        </div>

        <div class="footer-note">
            // End of thoughts
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const GITHUB_USERNAME = 'abhilekhgautam'; 
        const REPO_NAME = 'portfolio'; 
        const MAIN_LABEL = 'daily-log'; 
        const CACHE_KEY = 'thoughts_cache_v1';
        const CACHE_DURATION = 1000 * 70; 
        // -------------

        const feedElement = document.getElementById('feed');

        async function loadUpdates() {
            const urlParams = new URLSearchParams(window.location.search);
            const forceRefresh = urlParams.get('refresh') === 'true';

            if (!forceRefresh) {
                const cached = sessionStorage.getItem(CACHE_KEY);
                if (cached) {
                    const { timestamp, data } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_DURATION) {
                        renderPosts(data);
                        return;
                    }
                }
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/issues?labels=${MAIN_LABEL}&creator=${GITHUB_USERNAME}&state=open&sort=created&direction=desc`);
                
                if (response.status === 403) {
                    feedElement.innerHTML = `<div class="loading" style="color:#ef4444">Rate limit. Wait 60s.</div>`;
                    return;
                }
                
                if (!response.ok) throw new Error('API Error');
                
                const issues = await response.json();
                
                sessionStorage.setItem(CACHE_KEY, JSON.stringify({
                    timestamp: Date.now(),
                    data: issues
                }));
                
                renderPosts(issues);

            } catch (err) {
                console.error(err);
                feedElement.innerHTML = `<div class="loading">Error loading content.</div>`;
            }
        }

        function renderPosts(issues) {
            if (issues.length === 0) {
                feedElement.innerHTML = '<div class="loading">No thoughts recorded yet.</div>';
                return;
            }

            feedElement.innerHTML = '';

            issues.forEach(issue => {
                const moodLabels = issue.labels
                    .filter(l => l.name !== MAIN_LABEL)
                    .map(l => {
                        // GitHub color or default accent
                        const style = l.color ? `style="border-color:#${l.color}; color:#${l.color}; background: #${l.color}10"` : '';
                        return `<span class="mood-badge" ${style}>${l.name}</span>`;
                    })
                    .join('');

                const content = marked.parse(issue.body);

                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">
                        <img class="avatar" src="${issue.user.avatar_url}" alt="${issue.user.login}">
                        <div class="user-info">
                            <div class="row-top">
                                <span class="display-name">Abhilekh Gautam</span>
                                ${moodLabels}
                            </div>
                            <div class="row-bottom">
                                <span>@${issue.user.login}</span>
                                <span>•</span>
                                <span class="time" datetime="${issue.created_at}">${issue.created_at}</span>
                            </div>
                        </div>
                    </div>
                    <div class="post-content">
                        ${content}
                    </div>
                `;
                
                feedElement.appendChild(card);
            });

            timeago.render(document.querySelectorAll('.time'));
        }

        loadUpdates();
    </script>
</body>
</html>
